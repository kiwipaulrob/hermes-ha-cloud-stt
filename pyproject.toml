[project]
name = "hermes-ha-cloud-stt"
version = "1.0.0"
description = "Speech-to-text for Hermes Agent via a Home Assistant Assist pipeline (community plugin)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Paul Robertson" }]
requires-python = ">=3.11"
