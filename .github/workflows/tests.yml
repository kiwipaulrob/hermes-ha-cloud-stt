name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae6d727489eac49dbf09e259  # v5.5.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fetch hermes-agent core (test-only, for the ABC import)
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
      - name: Install plugin + test deps
        run: |
          python -m pip install -e ".[test]" 2>/dev/null || python -m pip install -e . pytest
      - name: Run tests
        run: PYTHONPATH=/tmp/hermes-agent python -m pytest -q
