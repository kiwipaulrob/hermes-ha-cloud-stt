name: tests

on:
  push:
  pull_request:

jobs:
  test:
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fetch hermes-agent core (test-only, for the ABC import)
        run: |
          rm -rf "$RUNNER_TEMP/hermes-agent"
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
      - name: Install plugin + test deps
        run: |
          python -m pip install -U pip
          python -m pip install pytest
          python -m pip install -e .
      - name: Run tests
        run: PYTHONPATH="$RUNNER_TEMP/hermes-agent" python -m pytest -q
